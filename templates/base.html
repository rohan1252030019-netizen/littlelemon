{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Little Lemon{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{% url 'home' %}">
        <span class="brand-mark">LL</span>
        <span class="brand-text">Little Lemon<small>Mediterranean Restaurant</small></span>
      </a>
      <nav class="site-nav">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'menu-page' %}">Menu</a>
        <a href="/api/">API</a>
        <a href="/admin/">Admin</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; {% now "Y" %} Little Lemon &mdash; Chicago, IL</p>
      <p>Django &middot; Django REST Framework &middot; MySQL</p>
    </div>
  </footer>
</body>
</html>
